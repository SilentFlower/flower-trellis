name: SessionStart 跨平台回归

on:
  pull_request:
    paths:
      - ".github/workflows/session-start.yml"
      - ".claude/hooks/session-start.py"
      - ".codex/hooks/session-start.py"
      - ".trellis/config.yaml"
      - ".trellis/scripts/**"
      - ".trellis/spec/**"
      - ".trellis/workflow.md"
      - "enhancements/0.6/**"
      - "src/assets/flower_session_start.py"
      - "src/assets/flower_update_hook.py"
      - "test/python/test_flower_session_start.py"
      - "test/python/test_flower_update_hook.py"
      - "vendor/skill-garden"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/session-start.yml"
      - ".claude/hooks/session-start.py"
      - ".codex/hooks/session-start.py"
      - ".trellis/config.yaml"
      - ".trellis/scripts/**"
      - ".trellis/spec/**"
      - ".trellis/workflow.md"
      - "enhancements/0.6/**"
      - "src/assets/flower_session_start.py"
      - "src/assets/flower_update_hook.py"
      - "test/python/test_flower_session_start.py"
      - "test/python/test_flower_update_hook.py"
      - "vendor/skill-garden"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session-start:
    name: SessionStart (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 运行 SessionStart 专项回归
        run: python -m unittest discover -s test/python -p "test_flower_session_start.py"
      - name: 运行动态更新上下文回归
        run: python -m unittest discover -s test/python -p "test_flower_update_hook.py"
